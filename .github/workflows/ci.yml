name: Login CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Jest globally (since no package.json)
      - name: Install Jest
        run: npm install -g jest

      # Run Jest tests directly
      - name: Run Unit Tests
        run: jest
